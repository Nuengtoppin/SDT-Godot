; The mod's numbers (ffbehaviorV3_1settings.txt, its key names). Points are shares of the way to passing out (0 to 1)
; unless said otherwise; the menu (Behaviour > Out of air) switches the effects on and sets their strength.

[eyes_up]
passoutraisestartpoint=0.3  ; where her eyes start turning up
passoutraiseendpoint=0.7  ; where they are all the way up
passouteyeanglestart=105  ; her eyes' angle at the start (90 level, 45 straight up)
passouteyeangleend=75  ; and at the end
passoutrandomanglerange=2  ; the most her eyes jitter, degrees (grows with how far up they are)

[eyes_open]
passoutraiseeyelidstartpoint=0.4  ; where her eyelids start opening
passoutraiseeyelidendpoint=0.9  ; where they are open widest
passouteyelidanglestart=40  ; the eyelid frame at the start (2 open, 150 closed)
passouteyelidangleend=5  ; and at the end
passouteyelidignorepoint=0.98  ; past this she closes her eyes as the game does

[darken]
passoutdarkenstartpoint=0.3  ; where the background starts darkening
passoutdarkenendpoint=0.9  ; where it is darkest

[pupils]
passoutshrinkirisfrompenisdepthstart=0.3  ; with his depth: share of the way to the hilt where they start shrinking
passoutshrinkirisfrompenisdepthend=1.0  ; and where they are smallest
passoutshrinkstartpoint=0  ; out of air: where they start shrinking
passoutshrinkendpoint=0.3  ; and where they are smallest
passoutirisshrinksizestart=0.9  ; their size before they shrink (the game: about 0.65 to 0.9, by her eyelids and shock)
