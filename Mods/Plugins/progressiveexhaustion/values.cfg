; progressiveExhaustionV8's numbers (the Loader pack's Settings/progressiveExhaustionV8.txt, its key names).
; Max: the most of the effect (0 none, 1 the whole effect); Rate: how much of the most each unit of exhaustion
; adds (a pass-out is one unit; max 0.8 with rate 0.1 is reached after 8); Start: units before the effect starts
; (999: never). Her exhaustion = (pass-outs + the dynamic part) x her exhaustion factor (character code).
; The menu (Behaviour > Exhaustion) switches the effect groups on and off.

[dynamic]
dynamicExhaustionEnabled=1  ; 1=on, 0=off (if you have a really slow computer turning this off might help slightly)
dynamicExhaustionMax=5.0  ; maximum units of exhaustion that can be obtained this way, set very high if you dont want a limit
dynamicExhaustionBuffer=1.0  ; units of exhaustion that will be ignored before actual exhaustion starts incrementing
passOutExhaustionModifier=0.1  ; Extra multiplier to dynamic exhaustion, based on current pass out count (allows dynamic exhaustion to occur more easily at higher pass out counts)
noExhaustionWithBreath=0  ; 1=on, 0=off, will stop exhaustion gain while her breath level is not 0 for inMouth, deepthroat, and held
inMouthExhaustion=0.0  ; units of exhaustion gained per frame of having the penis in her mouth (not losing breath/passout)
deepthroatExhaustion=0.05  ; units of exhaustion gained on throat
heldExhaustion=0.001  ; units of exhaustion gained per frame while held
swallowExhaustion=0.003  ; units of exhaustion gained per frame while swallowing (biting will also trigger this)
headGrabExhaustion=0.0  ; units of exhaustion gained when head is grabbed/slapped
vigorExhaustion=0.005  ; units of exhaustion gained per frame before being multiplied by percent vigor
wakeExhaustion=-1.5  ; units of exhaustion lost on wake
breathingExhaustion=-0.006  ; units of exhaustion lost per frame when breathing, will be multiplied by percent breath

[moremoods]
biteAdvisorFactor=1.15  ; this is what affects bite rate drop, this number is used in an equation that will adjust moremoods' biteoccuranceadvisor setting/value

[skin]
enableSkinSaturationDecrease=1  ; 1=on, 0=off
skinSaturationMax=0.25  ; decrease in skin saturation, 1.0 = no saturation/color
skinSaturationRate=0.025
skinSaturationReturnRate=0.006  ; increase in skin saturation (the actual value) per frame until it reaches its initial value

[eyes]
upperEyelidMax=0.9  ; upper eyelid max, 1.0 = closed eyes
upperEyelidRate=0.09
lowerEyelidMax=1.0  ; lower eyelid droop, 1.0 = 'normal' lower eyelid
lowerEyelidRate=0.12
enableVanillaWince=0  ; 1=on, 0=off, a consequence/feature of the upper eyelid effect is that it also reduces wince 'strength', enable this to use the vanilla wince (might look a little strange)
eyeMotionMax=1.0  ; lowered eye target, 1.0 = same as 'looking down' target
eyeMotionRate=0.125
eyeJitterStart=3  ; exhaustion value at which eye jitter effect starts
eyeJitterRangeFactor=1.3  ; set to 0 to disable, increase in jitter range per unit of exhaustion starting at 0, in vanilla 5.0 is the highest (based on passoutfactor)
eyeJitterSpeedFactor=0.06  ; set to 0 to disable, increase in jitter speed per unit of exhaustion starting at 0, in vanilla 0.2 is default when eyes jitter
disableEyeJitterFrightened=1  ; 1=on, 0=off, Disable eye jitter effects from this mod while on 'frightened' mood since it has its own
eyebrowMax=0.8  ; eyebrow raise/angle
eyebrowRate=0.08
normalEyebrowsStart=5  ; passouts until angry eyebrows change to normal ones, if no 'angry eyebrows' no effect
shockMax=1.0  ; pupil shock decrease, 1.0 = no shock
shockRate=0.1
eyeHighlightMax=1.0  ; eye highlight fade, 1.0 = no highlights
eyeHighlightRate=0.125
wakeEyeMotionMax=1.0  ; eyeroll start on wakeup, 1.0 = eyes will roll up from below
wakeEyeMotionRate=0.1
wakeShockMax=1.0  ; shock on wakeup, 1.0 = no shock
wakeShockRate=0.1

[breathing]
passOutMultiplier=0.75  ; multiplier applied to vanilla passout gain
passOutUseExhaustionFactor=1  ; 1 = on, uses inverse of exhaustionFactor as an additional multiplier applied to vanilla passout gain
passOutMax=0.5  ; how quickly she passes out
passOutRate=0.05
passOutVolumeMax=0.8  ; pass out sound volume, 1.0 = no sound
passOutVolumeRate=0.08
breathMax=0.95  ; how quickly breath drops, 1.0 = no breath, will also reduce breathing effect
breathRate=0.15
pullOffPowerIncreaseFactor=1.5  ; set to 1 to disable, keep this number lowish, pullOffPowerIncrease = basePullOffIncrease * (1 / pullOffPowerIncreaseFactor^totalExhaustion)
pullOffPowerMax=1.0  ; maximum pull off power, 1.0 = no pull off power
pullOffPowerRate=0.1
pullOffPowerStartMax=1.0  ; starting pull off power, 1.0 = no starting pull off
pullOffPowerStartRate=0.15
passOutRecoveryMax=0.5  ; how quickly she recovers from pass out, 1.0 = no recovery
passOutRecoveryRate=0.05
noBreathingThreshold=1  ; 1=on, 0=off, if on, she will stop breathing if she passes out and passOutRecovery is at max
throatResistanceMax=1.0  ; throat resistance percentage decrease, 1.0 = no resistance
throatResistanceRate=0.1
armsHerLegsStart=6  ; passouts until her arms will start on her legs on wake
armsLooseStart=8  ; passouts until her arms start loose on wake
saveArmPositions=1  ; 1=on, 0=off, if enabled, on reset her arms will move to the last position before changes due to exhaustion

[coughs]
coughMax=0.5  ; cough rate, 1.0 = no coughing
coughRate=0.05
coughFactorMax=0.8  ; cough force, 1.0 = no cough force
coughFactorRate=0.08
coughBreastAccelMax=0.8  ; breast movement on cough, 1.0 = no movement
coughBreastAccelRate=0.08
coughVolumeMax=0.8  ; cough volume, 1.0 = no sound
coughVolumeRate=0.08
openCoughFactorMax=0.8  ; all same as above but for open cough
openCoughFactorRate=0.08
openCoughBreastAccelMax=0.8
openCoughBreastAccelRate=0.08
openCoughVolumeMax=0.8
openCoughVolumeRate=0.08
gagMax=0.9  ; gag rate, 1.0 = no gagging
gagRate=0.09
gagVolumeMax=0.8  ; gag volume, 1.0 = no sound
gagVolumeRate=0.08
winceStart=4  ; exhaustion value at which wincing chance starts to decrease
winceMax=1  ; wince rate, 1.0 = no wincing
winceRate=0.1

[body]
blushMax=0.8  ; blush reduction from all sources, 1.0 = no blush
blushRate=0.08
tapHandsMax=1.0  ; hand tap rate, 1.0 = no tapping
tapHandsRate=0.1
tapHandsPowerMax=0.95  ; hand tap power, keep under 1.0
tapHandsPowerRate=0.095
waggleEyebrowsMax=1.0  ; waggle eyebrow rate (happy mood) 1.0 = no waggling
waggleEyebrowsRate=0.2
blinkMax=1  ; blink rate, 1.0 = no blinking
blinkRate=0.1
consecutiveBlinkMax=1  ; consecutive blink chance, 1.0 = no consecutive blinking
consecutiveBlinkRate=0.15
clenchTeethMax=1.0  ; teeth clench rate (angry mood), 1.0 = no clenching
clenchTeethRate=0.2
sweatMax=0.9  ; periodic sweat generation rate, 1.0 = sweat about every 15 frames, >1.0 can cause crashing
sweatRate=0.09
tearsStart=5  ; passouts until periodic tear generation start
tearsMax=1.0  ; rate of tear generation, 1.0 = about double the starting rate, >1.0 can cause crashing
tearsRate=0.1
swallowSlowMax=1.0  ; swallow animation speed, 1.0 = animation speed is normal speed * the multiplier
swallowSlowRate=0.2
swallowSlowMultiplier=2  ; >=1, multiplier applied to frames of swallow animation at max, ex: 2 = swallow will take twice as long at max

[face]
spentEyesStart=999  ; passouts until 'moreMoods' 'spent eyes' effect starts
tongueOutStart=999  ; passouts until her tongue will hangout
mouthNormalStart=5  ; passouts until her mouth shape will become the 'normal' mood shape
updateOnWake=0  ; 1 = on, 0 = off, if on eyebrows and mouth shape will only change while awake and when waking

[spent]
offActionStart=6  ; passouts until 'moreMoods' 'spent cough / off action' starts
offActionMax=1.0  ; frequency of off action trigger, 1.0 = about three times as frequent, >1.0 can cause crashing
offActionRate=0.15
offActionScaleWithCoughSettings=1  ; 1=on, 0=off, scale offaction cough with normal cough settings (not open cough)
offActionDrool=1
offActionDroolLimiter=1
offActionWince=1
offActionAddTear=1
offActionGenerateSplat=1
offActionBreastAccel=1
offActionCoughFactor=1
offActionCoughSound=0
offActionGagSound=0
offActionQuietGagSound=1
offActionSwallowSound=1
offActionSplatSound=1
