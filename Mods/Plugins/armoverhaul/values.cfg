[restrained]
; Restrained mode: 0 loose (hands on her thighs), 1 tight and 2 fixed (hands behind her back), 3 off.
; Struggling: a struggle percent builds up (breath, passing out, vigour, winces, coughs, waking) and moves her
; hands; past struggleShiftArmsThreshold she pulls an arm free now and then.
restrainedType=3  ; Restrained type on start, 0 - loose, 1 - tight, 2 - fixed, 3 - off
restrainedModeTransitions=1  ; 1=on, whether or not changing restrained modes will use arm transitions
restrainedType0Struggle=0  ; 1=on, enable struggling for loose restrained mode
restrainedType1Struggle=1  ; 1=on, enable struggling for tight restrained mode
strugglePhaseThreshold=0.3  ; 0-1, for loose mode, struggle percentage at which arm movement changes to second range
struggleShiftArmsThreshold=0.6  ; 0-1, struggle percent at which she will begin struggling
restrainedThighXOffset1Left=-240  ; Loose mode uses movement ranges from '1' to '2', then after passing
restrainedThighXOffset2Left=-200  ; the strugglePhaseThreshold, uses '2' to '3'
restrainedThighXOffset3Left=80  ; Tight mode just uses movement ranges from '2' to '3'
restrainedThighYOffset1Left=180
restrainedThighYOffset2Left=50
restrainedThighYOffset3Left=-90
restrainedThighRotation1Left=70
restrainedThighRotation2Left=30
restrainedThighRotation3Left=-75
restrainedThighXOffset1Right=-240
restrainedThighXOffset2Right=-200
restrainedThighXOffset3Right=80
restrainedThighYOffset1Right=180
restrainedThighYOffset2Right=50
restrainedThighYOffset3Right=-90
restrainedThighRotation1Right=70
restrainedThighRotation2Right=30
restrainedThighRotation3Right=-75
passoutRotationOffset1=-20  ; Extra rotation when passed out in loose mode
passoutRotationOffset2=60  ; Extra rotation when passed out in tight mode
passoutRotationSpeedMultiplier=5.5  ; Controls rotation speed of extra rotation when passed out
struggleThreshold=1  ; 0-1, chance threshold past which she will struggle
struggleBaseChance=0.9985  ; 0-1, base chance per frame of struggling
struggleRestMinTime=40  ; Minimum random frames between possible struggling
struggleRestMaxTime=80  ; Maximum random frames between possible struggling
struggleRestTimeScale=0.2  ; Multiplier to rest frames at highest struggle percentage
struggleMinTime=120  ; Minimum random frames to struggle when struggle is triggered
struggleMaxTime=160  ; Maximum random frames to struggle when struggle is triggered
struggleTimeScale=0.4  ; Multiplier to struggle frames at highest struggle percentage
struggleLooseTimeMultiplier=1.5  ; Multiplier to rest + struggle frames at highest struggle percentage for loose mode
struggleOtherArmChance=0.15  ; Chance that her other arm will be the one she struggles with after
struggleMovementRange=0.075  ; Absolute value range of her pos shift on struggle
struggleMovementScale=2.5  ; Multiplier to pos shift at highest struggle percentage
struggleMovementReturnMultiplier=0.5  ; Multiplier to pos shift that triggers when struggle ends
struggleCloseHandChance=0.998  ; 0-1, chance threshold past which she will close hands
struggleOpenHandMinTime=40  ; Minimum random frames between possible closing hands
struggleOpenHandMaxTime=80  ; Maximum random frames between possible closing hands
struggleOpenHandTimeScale=0.4  ; Multiplier to open hand frames at highest struggle percentage
struggleCloseHandMinTime=30  ; Minimum random frames to close hands when triggered
struggleCloseHandMaxTime=60  ; Maximum random frames to close hands when triggered
struggleCloseHandTimeScale=3.0  ; Multiplier to close hands frames at highest struggle percentage
struggleCloseHandMultiplier=1.5  ; Close hand chance multiplier at highest struggle percentage
struggleCurveExponent1=0.6  ; Exponent appied to arm movement in '1' to '2' movement range as struggle percentage
struggleCurveExponent2=0.6  ; Exponent appied to arm movement in '2' to '3' movement range
struggleLoss=0.006  ; Struggle percent loss each frame
struggleRandomLossFactor=0.99  ; Random multiplier to struggle percent on random loss trigger
struggleRandomLossChance=0.15  ; 0-1, chance of triggering random loss
struggleRandomGainFactor=1.015  ; Random multiplier to struggle percent on random gain trigger
struggleRandomGainChance=0.1  ; 0-1, chance of triggering random gain
strugglePassedOutLoss=0.008  ; Struggle percent loss each frame while passed out
struggleVigorGain=0.01  ; Struggle percent gain per frame multiplied by vigor percent
struggleWinceGain=0.005  ; Struggle percent gain on wince
struggleNoBreathingGain=0.006  ; Struggle percent gain per frame of no breathing
strugglePassoutGain=0.01  ; Struggle percent gain per frame multiplied by percent closeness to peak
strugglePassOutPeak=0.3  ; Inverse passout percent at which gain due to passout is highest
strugglePassOutPeakMultiplier=0.5  ; Multiplier to gain due to pass out when past the peak
