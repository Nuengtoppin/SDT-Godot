; SpankAnywhereForked's settings (the mod's own names and values). Power goes from 0 to powerMax while the
; mouse is held over her; each body part's Min / Max values are at power 0 / powerMax, in between in proportion.
; Hotkeys and the switches are in the plugin's settings and Behaviour > Spanking.

[general]
useExhaustionFactor=1  ; With progressiveexhaustion: 1 = her exhaustion factor scales what a hit does to her air, breath and exhaustion (a punch more, a spank less)
powerMax=40  ; Number of frames mouse needs to be held down until spank power reaches its maximum
spankColor="#BE0512"  ; her mark's colour, #RRGGBB (the mod's 0xBE0512)
audioThreshold1=5  ; Power at and under which the 'soft' spank sound effect will play
audioThreshold2=10  ; Power at and under which the second softest spank sound effect will play
audioThreshold3=20  ; Power at and under which the medium spank sound effect will play
audioThreshold4=30  ; Power at and under which the hard spank sound effect will play
spankSizeMin=0.5  ; Size of spank mark at minimum power
spankSizeMax=0.9  ; Size of spank mark at maximum power
volumeMin=0.5  ; Spank sound effect volume at minimum power
volumeMax=1.0  ; Spank sound effect volume at maximum power
fadeTimeMin=2000  ; Spank mark fade time in milliseconds at minimum power
fadeTimeMax=6000  ; Spank mark fade time in milliseconds at maximum power
alphaMin=0.5  ; Alpha value of spank mark at minimum power
alphaMax=1  ; Alpha value of spank mark at maximum power
maxEyeshock=120  ; Maximum total eyeshock possible
eyeshockThreshold=5  ; Power after which her eyeshock will begin to increase
spankStartEyeshock=15  ; Initial eyeshock added when spank power meets eyeshockThreshold
spankHoldEyeshock=1.5  ; Eyeshock added per frame while spank power increases (replaced with constant '1.0' once power is maxed)
afterEyeshockDelay=30  ; Number of frames after being spanked or punched during which eyeshock will not increment due to increasing power
keepAlphaMin=0.2  ; Spank mark alpha value after fading at minimum power if keepSpankMarks is on
keepAlphaMax=0.4  ; Spank mark alpha value after fading at maximum power if keepSpankMarks is on
clearFade=1  ; 1 = on, fade existing marks gradually when clear key is pressed, rather than instantly
clearFadeTimer=1500  ; (the mod: 10000) Time in ms that will be multiplied by each mark's alpha value to get the mark's fade rate (lower for faster fading, raise for slower fading)
openCoughDisable=0  ; There is a delay before she will perform an open cough, set to 1 to disable the open cough effect if you don't like the delay
motionDirection=1  ; Movement direction when spanked, 0 = backwards, 1 = forwards, 2 = both (random)
spankPleasureMax=110  ; Total pleasure at which he will not gain further pleasure from spanking (Max pleasure = 146)
wakeWithMouthFull=1  ; 1 = on, allows her to wake up once passout factor is back to 0 while her mouth is still full
mouthFullMoan=1  ; 1 = on, will cause her to moan when spanked or punched while her mouth is full and she winces
leftArmToggle=0  ; Hide his left arm when powering up a spank, 1 to enable
armToggleStart=5  ; Power after which to hide his left arm
punchColor="#531126"  ; her mark's colour, #RRGGBB (the mod's 0x531126)
punchKeepAlphaMin=0.3  ; Punch mark alpha value after fading at minimum power if keepPunchMarks is on
punchKeepAlphaMax=0.6  ; Punch mark alpha value after fading at maximum power if keepPunchMarks is on
punchMoveFactor=1.5  ; Multiplier applied to motion and cough factor effects when punching
punchSizeFactor=0.8  ; Multiplier applied to the size of marks when punching
punchStartEyeshock=30  ; Initial eyeshock added when punch power meets eyeshockThreshold
punchHoldEyeshock=1.5  ; Eyeshock added per frame while punch power increases (replaced with constant '1.0' once power is maxed)
punchBlushFactor=0.05  ; Multiplier applied to blush increase when punching, if using dynamicBlushing 1.3
blushMax=0.7  ; With Dynamic blushing on: the maximum blush alpha that can be caused by spanking
blushDecreaseRate=0.005  ; With Dynamic blushing on: the rate that blush caused by spanking will decrease per frame

[back]
backCoughFactorMin=0.2  ; Cough factor of flinch when spanked on back at minimum power
backCoughFactorMax=2.0  ; Cough factor of flinch when spanked on back at maximum power
backMotionMin=0.01  ; How much her position changes when spanked on back at minimum power (can be negative)
backMotionMax=0.1  ; How much her position changes when spanked on back at maximum power (can be negative)
backBreastAccelMin=0.0  ; Breast movement when spanked on back at minimum power
backBreastAccelMax=0.1  ; Breast movement when spanked on back at maximum power
backBlinkThreshold=10  ; Power at and under which she will blink when spanked on back
backWinceThreshold=20  ; Power at and under which she will wince when spanked on back
backGagThreshold=30  ; Power at and under which she will gag when spanked on back (while mouth is full, otherwise wince)
backCoughThreshold=40  ; Power at and under which she will cough when spanked on back
backEyeShockMin=10  ; Eye shock set when spanked on back at minimum power
backEyeShockMax=37  ; Eye shock set when spanked on back at maximum power
backTearsMin=0  ; Tears added when spanked on back at minimum power
backTearsMax=2  ; Tears added when spanked on back at maximum power
backWinceMin=0  ; Extra wince frames added when she winces due to a spank on back at minimum power
backWinceMax=20  ; Extra wince frames added when she winces due to a spank on back at maximum power
backPassOutMin=10  ; Passout factor reduced (max passout is 40 = passed out) when spanked on back at minimum power (can be negative)
backPassOutMax=20  ; Passout factor reduced (max passout is 40 = passed out) when spanked on back at maximum power (can be negative)
backBreathMin=1  ; Breath removed (max breath is 50) when spanked on back at minimum power (can be negative)
backBreathMax=20  ; Breath removed (max breath is 50) when spanked on back at maximum power (can be negative)
backExhaustionMin=0.1  ; With progressiveexhaustion: her exhaustion a punch adds (a spank takes away) at minimum power
backExhaustionMax=0.4  ; ... at maximum power
backPleasureMin=300  ; Pleasure given when spanked on back at minimum power (can be negative)
backPleasureMax=1500  ; Pleasure given when spanked on back at maximum power (can be negative)
backBlushMin=0.05  ; With Dynamic blushing on: blush alpha increase when spanked on back at minimum power
backBlushMax=0.2  ; With Dynamic blushing on: blush alpha increase when spanked on back at maximum power
backClenchTeethMin=0.2  ; Chance of teeth clench at minimum power
backClenchTeethMax=0.5  ; Chance of teeth clench at maximum power

